[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "igris-tic-tac-toe"
version = "1.0.0"
requires-python = ">=3.11"

[project.scripts]
igris-tic-tac-toe = "tic_tac_toe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
