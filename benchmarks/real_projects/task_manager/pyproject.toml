[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "igris-task-manager"
version = "1.0.0"
requires-python = ">=3.11"

[project.scripts]
igris-tasks = "task_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
