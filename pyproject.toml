[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "igris-os"
version = "5.0.0rc1"
description = "Orquestador local con permisos y entregas ejecutables verificables"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "psutil>=5.9", "PyQt6>=6.4"]

[project.scripts]
igris = "igris_os.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "coverage>=7"]
multiagent = ["langgraph>=0.2", "langchain-core>=0.3"]
providers = ["litellm>=1.40", "python-dotenv>=1.0"]
media = ["Pillow>=10.0", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]
