[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "igris-os"
version = "4.0.0"
description = "Asistente OODA verificable de IGRIS OS v4.0 para Windows"
requires-python = ">=3.11"

[project.scripts]
igris = "igris_os.cli:main"

[project.optional-dependencies]
ui = ["PyQt6>=6.4"]
dev = ["pytest>=8", "coverage>=7"]
ai = ["requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]
